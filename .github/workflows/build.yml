name: "Build binaries, create release"
on:
  pull_request:
    branches:
      main
    types:
      - opened
      - edited
      - synchronize
  push:
    tags: '*'

permissions:
  contents: read

env:
  SDL_VERSION: '3.4.20'
  SDL_IMAGE_VERSION: '3.4.8'
  SDL_MIXER_VERSION: '3.2.4'

jobs:
  build_linux:
    name: 'Linux build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7
      - name: 'Install SDL3'
        uses: './.github/actions/setup-sdl3'
        with:
          sdl_version: ${{ env.SDL_VERSION }}
      - name: 'Install SDL3_image'
        uses: './.github/actions/setup-sdl3_image'
        with:
          sdl_image_version: ${{ env.SDL_IMAGE_VERSION }}
      - name: 'Install SDL3_mixer'
        uses: './.github/actions/setup-sdl3_mixer'
        with:
          sdl_mixer_version: ${{ env.SDL_MIXER_VERSION }}
      - name: 'Configure and build'
        run: |
          cmake -DCMAKE_PREFIX_PATH=/usr/local/sdl -G Ninja -S . -B build
          cmake --build build --verbose
          cd build
          cpack -G TGZ --config CPackConfig.cmake

      - name: 'Archive binaries'
        uses: actions/upload-artifact@v7
        with:
          name: retro-fred-linux
          if-no-files-found: error
          path: |
            build/version
            build/Retro-Fred-*-Linux.tar.gz

  build_windows:
    name: 'Windows build'
    # windows-latest has Visual Studio 2026
    runs-on: windows-latest
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7

      - name: Download SDL3
        run: |
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL_VERSION }}/SDL3-devel-${{ env.SDL_VERSION }}-VC.zip" -OutFile "SDL3.zip"
          Expand-Archive -Path SDL3.zip -DestinationPath "C:\SDL3"

      - name: Download SDL3_image
        run: |
          Invoke-WebRequest "https://github.com/libsdl-org/SDL_image/releases/download/release-${{ env.SDL_IMAGE_VERSION }}/SDL3_image-devel-${{ env.SDL_IMAGE_VERSION }}-VC.zip" -OutFile "SDL3_image.zip"
          Expand-Archive -Path SDL3_image.zip -DestinationPath "C:\SDL3_image"

      - name: Download SDL3_mixer
        run: |
          Invoke-WebRequest "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${{ env.SDL_MIXER_VERSION }}/SDL3_mixer-devel-${{ env.SDL_MIXER_VERSION }}-VC.zip" -OutFile "SDL3_mixer.zip"
          Expand-Archive -Path SDL3_mixer.zip -DestinationPath "C:\SDL3_mixer"

      - name: 'Configure and build - 64 bit binary'
        run: |
          mkdir -p build\win64
          cmake -G "Visual Studio 18 2026" -A x64 "-DCMAKE_PREFIX_PATH=C:\SDL3;C:\SDL3_image;C:\SDL3_mixer" -S . -B build\win64
          cmake --build build\win64 --config Release --verbose
          cd build\win64
          cpack -G ZIP --config CPackConfig.cmake

      - name: 'Configure and build - 32 bit binary'
        run: |
          mkdir -p build\win32
          cmake -G "Visual Studio 18 2026" -A Win32 "-DCMAKE_PREFIX_PATH=C:\SDL3;C:\SDL3_image;C:\SDL3_mixer" -S . -B build\win32
          cmake --build build\win32 --config Release --verbose
          cd build\win32
          cpack -G ZIP --config CPackConfig.cmake

      - name: 'Archive binaries'
        uses: actions/upload-artifact@v7
        with:
          name: retro-fred-win
          if-no-files-found: error
          path: |
            build/win64/version
            build/win64/Retro-Fred-*-win64.zip
            build/win32/Retro-Fred-*-win32.zip

  build_android:
    name: 'Android build'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      # The versions of the SDK platform, build tools and NDK must match android/app/build.gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: 'Checkout source'
        uses: actions/checkout@v7
        with:
          path: src

      - name: 'Download SDL3'
        run: |
          curl -fsSL -O https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL_VERSION }}/SDL3-${{ env.SDL_VERSION }}.tar.gz
          tar xzf SDL3-${{ env.SDL_VERSION }}.tar.gz

      - name: 'Download SDL3_image'
        run: |
          curl -fsSL -O https://github.com/libsdl-org/SDL_image/releases/download/release-${{ env.SDL_IMAGE_VERSION }}/SDL3_image-${{ env.SDL_IMAGE_VERSION }}.tar.gz
          tar xzf SDL3_image-${{ env.SDL_IMAGE_VERSION }}.tar.gz

      - name: 'Download SDL3_mixer'
        run: |
          curl -fsSL -O https://github.com/libsdl-org/SDL_mixer/releases/download/release-${{ env.SDL_MIXER_VERSION }}/SDL3_mixer-${{ env.SDL_MIXER_VERSION }}.tar.gz
          tar xzf SDL3_mixer-${{ env.SDL_MIXER_VERSION }}.tar.gz

      - name: 'Configure and build'
        run: |
          cd src
          ./android/configure --sdl="$GITHUB_WORKSPACE/SDL3-${{ env.SDL_VERSION }}" --sdl-image="$GITHUB_WORKSPACE/SDL3_image-${{ env.SDL_IMAGE_VERSION }}" --sdl-mixer="$GITHUB_WORKSPACE/SDL3_mixer-${{ env.SDL_MIXER_VERSION }}"
          ./android/gradlew build --info

      - name: 'Archive APK'
        uses: actions/upload-artifact@v7
        with:
          name: retro-fred-android
          if-no-files-found: error
          path: |
            src/android/app/build/outputs/apk/debug/app-debug.apk

  build_macos:
    name: 'MacOS X build'
    runs-on: macos-latest
    env:
      # Minimum version supported by SDL3
      MACOSX_DEPLOYMENT_TARGET: 10.13
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7

      - name: 'Install SDL3'
        uses: './.github/actions/setup-sdl3'
        with:
          sdl_version: ${{ env.SDL_VERSION }}
      - name: 'Install SDL3_image'
        uses: './.github/actions/setup-sdl3_image'
        with:
          sdl_image_version: ${{ env.SDL_IMAGE_VERSION }}
      - name: 'Install SDL3_mixer'
        uses: './.github/actions/setup-sdl3_mixer'
        with:
          sdl_mixer_version: ${{ env.SDL_MIXER_VERSION }}

      - name: 'Configure and build - makefiles'
        run: |
          mkdir -p build/makefiles
          cd build/makefiles
          cmake -DCMAKE_PREFIX_PATH=/usr/local/sdl ../..
          cmake --build . --verbose --config Release
          cpack -G Bundle --config ./CPackConfig.cmake

      - name: 'Archive bundle - makefiles'
        uses: actions/upload-artifact@v7
        with:
          name: retro-fred-macos-mk
          if-no-files-found: error
          path: build/makefiles/Retro-Fred-*.dmg

      - name: 'Configure and build - Xcode'
        run: |
          mkdir -p build/xcode
          cd build/xcode
          cmake -DCMAKE_PREFIX_PATH=/usr/local/sdl -G Xcode ../..
          cmake --build . --config Release
          cpack -G Bundle --config ./CPackConfig.cmake

      - name: 'Archive bundle - xcode'
        uses: actions/upload-artifact@v7
        with:
          name: retro-fred-macos-xc
          if-no-files-found: error
          path: build/xcode/Retro-Fred-*.dmg

  unique_version:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7
      - name: 'Check release number is unique'
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: ./tools/check_version.sh --check-unique "${{ github.repository }}"
      - name: 'Check release number matches tag'
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./tools/check_version.sh --check-release-ref "${{ github.ref }}"

  release:
    runs-on: ubuntu-latest
    needs: [unique_version, build_windows, build_linux, build_android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 'Checkout source'
        uses: actions/checkout@v7

      - name: 'Download archived builds'
        uses: actions/download-artifact@v8
        with:
          path: build

      - name: 'Get version number'
        id: check_version
        run: |
          version=$(./tools/check_version.sh --show-version | tr -d '[:space:]')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 'Extract release notes from changelog'
        id: extract_notes
        uses: sean0x42/markdown-extract@v2
        with:
          file: CHANGELOG.md
          pattern: ${{ steps.check_version.outputs.version }}
          no-print-matched-heading: true

      - name: Rename files for release
        run: |
          version=${{ steps.check_version.outputs.version }}
          mkdir build/release
          mv -i build/retro-fred-win/win64/Retro-Fred-$version-win64.zip build/release
          mv -i build/retro-fred-win/win32/Retro-Fred-$version-win32.zip build/release
          mv -i build/retro-fred-android/app-debug.apk build/release/Retro-Fred-$version-android-debug.apk

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/release/*
          body: ${{ steps.extract_notes.outputs.markdown }}
          name: ${{ steps.check_version.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN }}
