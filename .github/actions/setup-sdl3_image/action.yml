name: 'Build SDL3_image'
description: 'Downloads and builds SDL3_image. SDL3 must be installed in /usr/local/sdl'
inputs:
  sdl_image_version:
    description: 'SDL3_image version to build'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential git pkg-config cmake ninja-build
      shell: bash

    - name: Cache SDL3_image Build
      id: cache-sdl3_image
      uses: actions/cache@v6
      with:
        path: |
          SDL3_image-${{ inputs.sdl_image_version }}-install.tar.gz
        key: ${{ runner.os }}-${{ runner.arch }}-sdl3_image-${{ inputs.sdl_image_version }}-key1

    - if: ${{ steps.cache-sdl3_image.outputs.cache-hit != 'true' }}
      name: Download and build SDL3_image
      run: |
        curl -fsSL -O https://github.com/libsdl-org/SDL_image/releases/download/release-${{ inputs.sdl_image_version }}/SDL3_image-${{ inputs.sdl_image_version }}.tar.gz
        tar xzf SDL3_image-${{ inputs.sdl_image_version }}.tar.gz
        cmake -S SDL3_image-${{ inputs.sdl_image_version }} -B SDL3_image-${{ inputs.sdl_image_version }}-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local/sdl \
          -DCMAKE_PREFIX_PATH=/usr/local/sdl -DSDLIMAGE_SAMPLES=OFF -DSDLIMAGE_TESTS=OFF
        cmake --build SDL3_image-${{ inputs.sdl_image_version }}-build
        mkdir install
        DESTDIR=$(realpath install) cmake --install SDL3_image-${{ inputs.sdl_image_version }}-build
        tar czf SDL3_image-${{ inputs.sdl_image_version }}-install.tar.gz -C install/usr/local sdl
      shell: bash

    - name: Install SDL3_image
      run: |
        sudo tar xf SDL3_image-${{ inputs.sdl_image_version }}-install.tar.gz -C /usr/local
      shell: bash
